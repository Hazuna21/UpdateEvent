name: Build release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter HazunaV2.csproj | Select-Object -First 1
          if (-not $proj) { Write-Host "HazunaV2.csproj tidak ditemukan. Isi repo:"; Get-ChildItem -Recurse -Depth 2 | Select-Object -ExpandProperty FullName; exit 1 }
          Write-Host "Proyek: $($proj.FullName)"
          dotnet publish $proj.FullName -c Release -r win-x64 --self-contained false -p:Version=1.0.${{ github.run_number }} -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath HazunaV2.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Hazuna v1.0.${{ github.run_number }}
          files: HazunaV2.zip
